[workspace]
resolver = "3"
members = [
    "crates/openfirma-core",
    "crates/openfirma-cades",
    "crates/openfirma-pades",
    "crates/openfirma-xades",
    "crates/openfirma-keystore",
    "crates/openfirma-browser",
    "crates/openfirma-cli",
    "crates/openfirma-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later OR EUPL-1.1"
repository = "https://github.com/millaguie/openfirma"
description = "Pure Rust reimplementation of the Spanish government's AutoFirma electronic signature client"

[workspace.dependencies]
# --- ASN.1 / X.509 stack, one coherent generation (see docs/adr/0002) ---
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["derive", "oid", "alloc", "std"] }
spki = { version = "0.8", features = ["alloc", "std"] }
x509-cert = { version = "0.3", features = ["std", "pem"] }
pkcs8 = { version = "0.11", features = ["std", "pem"] }

# --- digests ---
digest = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
sha1 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }

# --- asymmetric ---
# pinned: rsa 0.9 stable sits on digest 0.10 / signature 2 and carries
# RUSTSEC-2023-0071 (Marvin). 0.10 rc is the only pure Rust RSA that joins
# the current generation and fixes it. Re-evaluate on 0.10 stable.
rsa = { version = "=0.10.0-rc.19", features = ["std", "sha2"] }
p256 = { version = "0.14", default-features = false, features = ["std", "pem", "pkcs8", "ecdsa", "arithmetic"] }
signature = "3"
rand_core = "0.10"

# --- utilities ---
thiserror = "2"
hex = "0.4"
base64 = "0.23"
# Constant time comparison for the PKCS#12 MAC, and zeroing of decrypted key
# material on drop. Both are pure Rust and both are already in the dependency
# tree through the RustCrypto crates; this only calls them by name.
subtle = "2.6"
zeroize = "1"
# The XAdES Id attributes are UUIDv4 like AutoFirma's (java.util.UUID). Pure
# Rust, and not a new library in the binary: getrandom 0.4 is already in the
# dependency tree through rsa -> crypto-bigint, this only calls it by name.
getrandom = "0.4"
# FlateDecode, which is how a cross-reference stream and an object stream are
# stored. rust_backend is miniz_oxide, pure Rust; the default is pinned off so
# a future release cannot quietly swap in a C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
# dlopen/GetProcAddress for PKCS#11 modules (ADR-0004: a Cryptoki module is a
# plugin loaded at runtime, never linked). Pinned to 0.8 because 0.9 raises
# its own MSRV above the workspace's rust-version = 1.85. The crate has no
# unsafe beyond the FFI it wraps and pulls no C code.
libloading = "0.8"
# The file dialogs of openfirma-gui (docs/adr/0006). Not a second signing
# stack: it only shows the OS's own open/save dialog, so on Linux and Windows
# the dialog is GTK/Win32 (not RustCrypto, not crypto) — like every native
# file picker. Version chosen by lookup: 0.16 is the current release, and its
# rfd-derive proc macro is pure Rust. Everything else in the GUI goes through
# egui itself, which drags no system library beyond OpenGL (see ADR-0006).
rfd = "0.16"

# --- GUI, feature-gated behind `gui` and never a CLI dependency: see ADR-0006 ---
# eframe 0.37 is the current release; it is egui's own windowing framework.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
] }
egui = "0.37"
# The windowless UI test harness of egui (ADR-0006): it drives the widget tree
# without a display, which is what lets `cargo test` assert the GUI's logic.
# `accesskit` is what egui_kittest's eframe seam (`build_eframe`) requires of
# eframe: the harness reads the widget tree through AccessKit, so the App must
# publish it. The snapshot feature stays off — pixel tests would pin fonts.
egui_kittest = { version = "0.37", features = ["eframe"] }

# NOTE: no rcgen. It pulls ring or aws-lc-rs, which are C/asm, and that would
# break the pure Rust rule even as a dev dependency. Test certificates come
# from tools/gen-testcert.sh, which drives the openssl CLI.

# --- workspace crates ---
openfirma-core = { path = "crates/openfirma-core", version = "0.1.0" }
openfirma-cades = { path = "crates/openfirma-cades", version = "0.1.0" }
openfirma-pades = { path = "crates/openfirma-pades", version = "0.1.0" }
openfirma-xades = { path = "crates/openfirma-xades", version = "0.1.0" }
openfirma-keystore = { path = "crates/openfirma-keystore", version = "0.1.0" }
openfirma-browser = { path = "crates/openfirma-browser", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true

# rsa/num-bigint key ops are unusable without optimization in debug builds
[profile.dev.package."*"]
opt-level = 2
