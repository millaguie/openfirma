name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The token default is read; only `publish` needs to write, and it says so on
# itself (round two's N-5: the whole workflow used to carry contents: write, which
# the build legs — the ones that compile code from a push and run scripts out of
# the repository — never needed).
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, glibc, the two architectures AutoFirma ships plus arm64.
          # `gui` marks where the window binary (openfirma-gui) builds: it is
          # the runner's native target, so eframe links the system's own X11/
          # Wayland client libraries (installed below). Non-native targets stay
          # CLI-only and say so in the release notes.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            gui: true
            setup_gui: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Static Linux binary, no glibc version constraint, works as a
          # portable drop in for AppImage and containers
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          # Windows 64 and 32 bit. AutoFirma still ships a 32 bit installer
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            gui: true
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          # macOS Intel and Apple Silicon, separate artifacts like AutoFirma.
          # Not notarized, so Gatekeeper will warn until we have a Developer ID
          # macos-13 runners are being retired and queue forever, and the SDK
          # is universal, so Intel builds from the arm64 runner
          - target: x86_64-apple-darwin
            os: macos-latest
            gui: true
          - target: aarch64-apple-darwin
            os: macos-latest
            gui: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No rust-cache here on purpose (round two's N-5): a release artifact should
      # come from the lockfile in this checkout, not from whatever object cache a
      # previous dispatch left under the same key. The CI legs keep their caches;
      # publishing is where byte-for-byte reproducibility starts counting.

      - name: platform packages
        if: matrix.setup
        run: ${{ matrix.setup }}

      # eframe's Linux sys crates resolve the X11/Wayland client libraries at
      # link time; only the native-glibc job ships the GUI and installs them.
      - name: GUI build packages
        if: matrix.setup_gui
        run: ${{ matrix.setup_gui }}

      # Targets without `gui: true` leave the GUI member out of the workspace
      # build (`--exclude openfirma-gui`): no binary other than openfirma-gui
      # depends on eframe/egui/rfd, and the member's own bin declares
      # required-features. (The old comment described a --no-default-features
      # flag that no longer exists.)
      - name: build every member without the GUI (non-GUI targets)
        if: ${{ !matrix.gui }}
        run: cargo build --release --locked --workspace --exclude openfirma-gui --target ${{ matrix.target }}

      - name: build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin openfirma

      # The window ships exactly where the matrix says `gui: true`, and nowhere
      # else. Those are the targets whose toolkit the leg can link: all four
      # Apple/Windows x64 and Linux glibc entries build it, including the Intel
      # macOS one that is cross-built from the arm64 runner (the SDK is
      # universal). A target without the flag — the two ARM Windows entries, the
      # musl static build, aarch64 Linux — carries no openfirma-gui: the GUI is
      # built only where the leg provisions its target's native windowing
      # libraries, and shipping a CLI-only binary beats shipping nothing. Round
      # 3's N3-1 caught this
      # comment promising GUI for aarch64 Windows while the matrix did not; the
      # release notes and `tools/check-workflows.py` now derive from the matrix
      # itself so the sentence cannot drift again.
      - name: build GUI
        if: matrix.gui
        run: cargo build --release --locked --target ${{ matrix.target }} -p openfirma-gui --bin openfirma-gui

      # Third-party licence report: MIT/Apache/BSD/ISC/Zlib/OFL all require
      # their notices to travel with the binaries, so `cargo about` renders
      # them from THIS job's Cargo.lock and the archive carries the result
      # (review 07, H-12: before this, artifacts shipped openfirma's own
      # LICENSES/ only and NOTICE pointed at a tool nobody ran). Built once
      # per matrix leg on the runner itself — the report describes the exact
      # lockfile the binary was compiled from.
      - name: third-party licence report
        shell: bash
        run: |
          # `--features cli` is NOT optional on 0.9.x: the feature that builds
          # the cargo-about binary is off by default, so a plain install ends
          # with `warning: none of the package's binaries are available for
          # install using the selected features / bin "cargo-about" requires
          # the features: cli` and the next line dies with
          # `error: no such command: about` (exit 101). This step and the
          # config it drives never ran before the first release dispatch
          # (run 39128074408), where all eight legs failed here: the ci
          # workflow's `licences` job now runs these exact commands on every
          # push, so the gate is exercised before a tag exists.
          cargo install cargo-about --locked --version "^0.9" --features cli
          cargo about generate tools/ABOUT_TEMPLATE.hbs > THIRD-PARTY-LICENSES.html
          grep -q "epaint_default_fonts" THIRD-PARTY-LICENSES.html  # the GUI fonts must appear

      # Every artifact carries the license texts and the attribution notice,
      # because that is a condition of the GPL/EUPL distribution, not a nicety
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="openfirma-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/LICENSES"
          cp "target/${{ matrix.target }}/release/openfirma" "$name/"
          if [ "${{ matrix.gui }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/openfirma-gui" "$name/"
          fi
          cp README.md NOTICE.md THIRD-PARTY-LICENSES.html "$name/"
          cp LICENSES/* "$name/LICENSES/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "openfirma-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$name/LICENSES" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/openfirma.exe" "$name/"
          if ("${{ matrix.gui }}" -eq "true") {
            Copy-Item "target/${{ matrix.target }}/release/openfirma-gui.exe" "$name/"
          }
          Copy-Item README.md,NOTICE.md,THIRD-PARTY-LICENSES.html "$name/"
          Copy-Item LICENSES/* "$name/LICENSES/"
          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          $h = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$h  $name.zip" -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfirma-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  # A tag publishes only over a green suite of ITS OWN commit (round two's N-5:
  # publish used to depend on the build legs alone, so CI being red at tag time
  # was nobody's problem). This is not the authoritative gate — ci.yml on main
  # stays that, with the crosscheck tools and the keystores installed and
  # OPENFIRMA_REQUIRE_TESTS turning any skip into a failure. What this job adds
  # is the ordering: nothing reaches the release page while the same commit's
  # tests fail. It generates the test PKI and runs without REQUIRE_TESTS, so a
  # missing SoftHSM or xmlsec1 skips here instead of failing; that is stated
  # rather than papered over, because "the tag's tests were red" is the failure
  # this job exists to catch and nothing else.
  test:
    name: test ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      # eframe links the X11/xkb client libraries at check time on Linux, or the
      # workspace test build dies in the sys crates (the same list ci.yml's lint
      # and legs install).
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - run: bash tools/gen-testcert.sh
      - run: cargo test --workspace --locked

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: list what we are publishing
        run: ls -lh dist

      - name: state what the window ships on
        # Keep this list in step with the matrix above: the GUI rides exactly
        # the `gui: true` entries, nothing else. (H-21, review 07: these notes
        # once claimed aarch64 Windows carried the window and called the arm64
        # Linux runner "cross"; both were false.)
        #
        # This goes to a FILE handed to the release as its body (round two's
        # N-3): everything used to be appended to $GITHUB_STEP_SUMMARY, which is
        # the workflow run page — a place a person downloading a binary never
        # visits. The action prepends this body to the generated commit list, so
        # the caveats are the first thing on the release page and the commits
        # follow underneath.
        run: |
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          {
            echo "### openfirma-gui (the window)"
            echo ""
            echo "Ships inside the artifacts for \`x86_64-unknown-linux-gnu\`,"
            echo "\`x86_64-pc-windows-msvc\`, \`x86_64-apple-darwin\` and"
            echo "\`aarch64-apple-darwin\`."
            echo "The other artifacts (i686 and aarch64 Windows, x86_64 musl,"
            echo "aarch64 Linux) carry the CLI only: the window is built on the"
            echo "targets whose runner provisions its native OpenGL/X11 client"
            echo "libraries, and those are the four listed above."
            echo ""
            echo "\`x86_64-unknown-linux-musl\` is a static binary: PKCS#11 and"
            echo "NSS modules load with \`dlopen\`, which a static musl binary"
            echo "cannot do - that artifact signs with PKCS#12 files; for"
            echo "\`--store pkcs11:\`/\`nss\` use the glibc build."
            echo ""
            echo "PKCS#11 and NSS are tested on Linux (SoftHSM and libsoftokn3)."
            echo "On Windows the same code compiles and is linted, but no module"
            echo "has ever been loaded there: CI provisions no SoftHSM for the"
            echo "Windows runners. The Windows certificate store has never run"
            echo "against a real card either, and neither PKCS#11 nor NSS has ever"
            echo "been executed on macOS."
            echo ""
            echo "The window has only ever run on Linux: the Windows and macOS"
            echo "builds are compiled and published, never launched."
            echo ""
            echo "The browser protocol (\`afirma-uri\`, \`afirma-serve\`) is"
            echo "experimental and is NOT part of what 0.1.0 supports: no live sede"
            echo "reaches it (there is no wss transport yet) and \`afirma-uri"
            echo "--register\` takes the afirma:// scheme away from AutoFirma."
          } > "$notes"
          # the run page keeps it too, but it is no longer the only copy
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          generate_release_notes: true
