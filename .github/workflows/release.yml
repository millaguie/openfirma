name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, glibc, the two architectures AutoFirma ships plus arm64.
          # `gui` marks where the window binary (openfirma-gui) builds: it is
          # the runner's native target, so eframe links the system's own X11/
          # Wayland client libraries (installed below). Non-native targets stay
          # CLI-only and say so in the release notes.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            gui: true
            setup_gui: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Static Linux binary, no glibc version constraint, works as a
          # portable drop in for AppImage and containers
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          # Windows 64 and 32 bit. AutoFirma still ships a 32 bit installer
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            gui: true
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          # macOS Intel and Apple Silicon, separate artifacts like AutoFirma.
          # Not notarized, so Gatekeeper will warn until we have a Developer ID
          # macos-13 runners are being retired and queue forever, and the SDK
          # is universal, so Intel builds from the arm64 runner
          - target: x86_64-apple-darwin
            os: macos-latest
            gui: true
          - target: aarch64-apple-darwin
            os: macos-latest
            gui: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          channel: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: platform packages
        if: matrix.setup
        run: ${{ matrix.setup }}

      # eframe's Linux sys crates resolve the X11/Wayland client libraries at
      # link time; only the native-glibc job ships the GUI and installs them.
      - name: GUI build packages
        if: matrix.setup_gui
        run: ${{ matrix.setup_gui }}

      # Any target that could not link a windowing system still builds with
      # `--no-default-features`, which drops the `gui` feature (eframe, egui,
      # rfd) — this is what makes the GUI an opt-out workspace member rather
      # than a hard dependency of the CLI: no bin other than openfirma-gui
      # ever needs it, and openfirma-gui's own bin has required-features.
      - name: build every member without the GUI (non-GUI targets)
        if: ${{ !matrix.gui }}
        run: cargo build --release --workspace --exclude openfirma-gui --target ${{ matrix.target }}

      - name: build CLI
        run: cargo build --release --target ${{ matrix.target }} --bin openfirma

      # The window ships where its toolkit builds (gui: true above): the
      # runner's native targets. The cross compilations — x86_64 binaries
      # built from an arm64 macOS image, and any target whose matrix entry
      # omits `gui` — carry no openfirma-gui: a cross sysroot has no
      # windowing system to link against, and shipping a CLI-only binary
      # beats shipping nothing. The release notes say exactly which
      # artifacts hold the GUI.
      - name: build GUI
        if: matrix.gui
        run: cargo build --release --target ${{ matrix.target }} -p openfirma-gui --bin openfirma-gui

      # Every artifact carries the license texts and the attribution notice,
      # because that is a condition of the GPL/EUPL distribution, not a nicety
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="openfirma-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/LICENSES"
          cp "target/${{ matrix.target }}/release/openfirma" "$name/"
          if [ "${{ matrix.gui }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/openfirma-gui" "$name/"
          fi
          cp README.md NOTICE.md "$name/"
          cp LICENSES/* "$name/LICENSES/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "openfirma-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "$name/LICENSES" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/openfirma.exe" "$name/"
          if ("${{ matrix.gui }}" -eq "true") {
            Copy-Item "target/${{ matrix.target }}/release/openfirma-gui.exe" "$name/"
          }
          Copy-Item README.md,NOTICE.md "$name/"
          Copy-Item LICENSES/* "$name/LICENSES/"
          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          $h = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$h  $name.zip" -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openfirma-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: list what we are publishing
        run: ls -lh dist

      - name: state what the window ships on
        # The GUI binary rides every `gui: true` artifact (x86_64 Linux,
        # both Windows 64-bit families where MSVC builds it, both macOS);
        # i686 Windows, musl and aarch64-linux-from-cross carry the CLI only.
        run: |
          {
            echo ""
            echo "### openfirma-gui (the window)"
            echo ""
            echo "Ships inside the artifacts for \`x86_64-unknown-linux-gnu\`,"
            echo "\`x86_64-pc-windows-msvc\`, \`aarch64-pc-windows-msvc\`,"
            echo "\`x86_64-apple-darwin\` and \`aarch64-apple-darwin\`."
            echo "The other artifacts (i686 Windows, musl, aarch64 Linux via cross)"
            echo "carry the CLI only: their toolchain has no windowing system to link."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          files: dist/*
          generate_release_notes: true
