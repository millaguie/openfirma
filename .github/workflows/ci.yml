name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# The pipeline only reads the repository; nothing here writes to it. (The
# release workflow is where content: write lives, and only its publish job.)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NSS discovery (finding A7) reads the browser profile roots of $HOME and
  # friends. GitHub runners come with service accounts whose trees contain
  # real Firefox profiles, which would make every discovery assertion about
  # the runner's desktop instead of the fixture. Point the list at something
  # that cannot exist: tests lay their own trees under a fixture HOME inside
  # one locked window and override this variable for its duration.
  OPENFIRMA_FIREFOX_PARENTS: /nonexistent
  # The crosscheck tests skip themselves when the test PKI is missing. In CI
  # the material is generated on purpose, so a skip there means the generation
  # step silently broke and the suite would go green without verifying
  # anything. This turns a skip into a failure.
  #
  # Two opt-outs exist, and neither one is this variable (review 07, H-2):
  #   OPENFIRMA_ALLOW_SKIP            — read ONLY by openfirma-keystore's
  #       tests: keystore material that cannot exist on a runner (no packaged
  #       SoftHSM on macOS/Windows, an empty system store) may skip there.
  #   OPENFIRMA_ALLOW_NONKEYSTORE_SKIP — set by a job whose PKI step could
  #       not run because the runner has no openssl at all; nothing sets it
  #       today (every runner ships an openssl), and it is spelled out here
  #       so an accidental export in a future job is auditable.
  # A job may never blanket-disable REQUIRE_TESTS: if the PKI step fails for
  # any other reason, the job must go red, loudly.
  OPENFIRMA_REQUIRE_TESTS: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2, pinned to the tag's commit (review 07, H-13:
      # tags are mutable references; a workflow that trusts a tag trusts
      # whatever it happened to point at on the day someone bumped it).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dtolnay/rust-toolchain pinned to master's tip as of 2026-10-17 — the
      # commit SHA, which is the only stable reference the repo offers (it has
      # no release tags). The `stable` toolchain it installs stays fresh by
      # design: the MSRV floor is what the msrv job pins, not this input.
      # NOTE the action's input is `toolchain`, NOT `channel`: writing
      # `channel:` here fails the step with "'toolchain' is a required input"
      # (learned from run 39067932116).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # eframe (the GUI workspace member, feature `gui` is on by default)
      # links the X11/xkb client libraries at check time on Linux; without
      # them `cargo clippy --all-targets` cannot resolve the sys crates.
      # qpdf/poppler/xmlsec ride along: the require_or_skip helpers now treat
      # a missing crosscheck tool as a CI failure, so the runners that must
      # prove those checks have to install them (review 07, H-1).
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev qpdf poppler-utils xmlsec1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  # RustSec advisory gate (review 07, H-5/H-14). The audit reads the lockfile
  # and fails on any vulnerability that is not explicitly ignored in
  # .cargo/audit.toml, where every exception carries its reason. This is what
  # keeps "the pin does not fix Marvin" from ever becoming a secret again: the
  # ignore list IS the documented risk register.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # MSRV gate (review 07, H-8). The workspace declares two floors: everything
  # but the GUI builds on 1.85; eframe/egui 0.37 demand 1.95, so openfirma-gui
  # carries that rust-version itself. Each floor is checked at its own
  # toolchain, which is what makes the declarations tested rather than wished:
  # `--exclude openfirma-gui` proves no CLI-path crate (nor any of its
  # dependencies) needs more than 1.85 — cargo refuses a dependency whose
  # rust-version beats the active toolchain, so a clean check IS the proof,
  # and nothing here uses --ignore-rust-version to fake it; the GUI's own
  # floor gets the same proof at 1.95.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      # --ignore-rust-version is NOT used anywhere on this job's CLI path: the
      # dependency graph of every member below must genuinely build on 1.85.
      - name: check everything but the GUI at 1.85
        run: cargo +1.85 check --workspace --exclude openfirma-gui --all-targets --locked
      - name: check the GUI at its own floor, 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check -p openfirma-gui --all-targets --locked

  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            openssl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            openssl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            openssl: true
          # Not macos-13, GitHub is retiring those runners and the job sits
          # queued forever. The SDK is universal, so the Intel target builds
          # fine from an arm64 runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            openssl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            openssl: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            openssl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The crosscheck tests are the ones that prove our CMS output is
      # accepted by an independent implementation, so openssl has to be on
      # PATH and the test PKI has to exist before cargo test runs.
      #
      # gen-p12-fixtures.sh rides along: the wave-4a keystore interop tests
      # read the same PKI (its cert/key) to synthesize their PKCS#12 fixtures,
      # and OPENFIRMA_REQUIRE_TESTS makes a missing fixture a failure — so on
      # any runner that has an openssl, the fixtures must be generated here.
      # Where there is no openssl at all, the allow-skip env set below covers
      # them too.
      #
      # On Windows this step runs in Git Bash, which can see the openssl that
      # Git for Windows bundles, but the test step runs in pwsh and cannot. So
      # the directory always goes to GITHUB_PATH, converted with cygpath,
      # whether or not bash already found it.
      - name: generate test PKI
        shell: bash
        run: |
          openssl_bin="$(command -v openssl || true)"
          if [ -z "$openssl_bin" ]; then
            for candidate in "$(dirname "$(command -v git)")/../usr/bin" "/c/Program Files/Git/usr/bin"; do
              if [ -x "$candidate/openssl.exe" ]; then openssl_bin="$candidate/openssl.exe"; break; fi
            done
          fi
          if [ -z "$openssl_bin" ]; then
            # Honest label: this runner has no openssl, so PKI-gated tests
            # skip. H-2: the opt-out is now NONKEYSTORE-scoped — it relaxes
            # nothing a keystore test reads, and it is exported only after
            # proving the absence below (the old blanket ALLOW_SKIP let this
            # step's failure mode green-light every other test too). The
            # gen-testcert/gen-p12-fixtures calls below do NOT carry `|| true`
            # on purpose: with REQUIRE_TESTS still in force, a generation
            # failure must fail the job loudly, never masquerade as skips.
            echo "no openssl on this runner, crosscheck tests will skip"
            echo "OPENFIRMA_ALLOW_NONKEYSTORE_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          dir="$(dirname "$openssl_bin")"
          export PATH="$dir:$PATH"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -w "$dir")"; fi
          echo "$dir" >> "$GITHUB_PATH"
          openssl version
          ./tools/gen-testcert.sh
          # gen-p12-fixtures.sh also needs a python3 (re-MACs the java-empty
          # shapes). Its absence used to kill this step with "command not
          # found" — loudly failing unrelated tests while silently skipping
          # java-*.p12 forever. Warn and let the fixture tests skip instead;
          # a real generation failure still has no `|| true` in front of it.
          if command -v python3 >/dev/null 2>&1; then
            ./tools/gen-p12-fixtures.sh
          else
            echo "no python3 on this runner; PKCS#12 interop fixtures stay absent and their tests skip"
          fi

      # Where no keystore can be built (see the two linux-only steps above),
      # the KEYSTORE tests must skip instead of panicking under
      # OPENFIRMA_REQUIRE_TESTS: the platform stores on macOS and Windows are
      # empty on a CI runner, which is an environment fact, not a bug. This
      # variable reaches openfirma-keystore's tests ONLY — every other test
      # keeps the panic-on-skip guarantee on these platforms (review 07, H-2).
      - name: allow keystore skips where no store exists (macos, windows)
        if: runner.os != 'Linux'
        run: echo "OPENFIRMA_ALLOW_SKIP=1" >> "$GITHUB_ENV"
        shell: bash

      # clippy on every OS in the matrix (review 07, H-9): windows.rs and
      # macos.rs sit behind cfg(target_os) gates and Linux's lint job never
      # compiles them, so their unsafe FFI blocks were unlinted code. This
      # runs AFTER the test step; a lint failure fails the job like any other.
      - name: clippy for this platform's own code
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      # The PKCS#11 integration tests need real modules to load: SoftHSM as a
      # generic token and NSS's libsoftokn3 for the shared-DB path. Linux only
      # — macOS and Windows have no packaged softhsm, and their keystore tests
      # skip by design (the platform stores cannot be provisioned either).
      # Installed before the PKI step so its failure is visible on its own.
      # The aarch64 job builds with --target for the same arch the runner has,
      # so test binaries execute here and the keystore tests run too; that
      # needs the real modules: SoftHSM as a generic token and NSS's
      # libsoftokn3 for the shared-DB path. macOS and Windows have no packaged
      # softhsm and their stores cannot be provisioned, so there those tests
      # skip by design. qpdf/poppler/xmlsec join the install: the crosscheck
      # tools are CI dependencies now (their absence fails the suite through
      # require_or_skip instead of silently skipping it — review 07, H-1).
      # Installed before the PKI step so its failure is visible on its own.
      - name: install PKCS#11 test modules and crosscheck tools (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc libnss3 qpdf poppler-utils xmlsec1

      # eframe's sys crates need the windowing client libraries to LINK on
      # Linux even for a headless build (the kittest tests never open a
      # window, but the binary does). macOS carries Metal/OpenGL in the SDK
      # and Windows has its own, so only Linux needs the apt packages.
      - name: install GUI build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      # The material the PKCS#11 tests load, built only where it can be
      # *found* at test time: step env does not reach a later `cargo test`
      # (only GITHUB_ENV does), so this is a sibling step that exports it.
      - name: build PKCS#11 test keystores (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./tools/setup-test-keystores.sh | tee /tmp/keystore-setup.log
          # GITHUB_ENV is a dotenv file: only the value GitHub parses reaches
          # the test step. The setup script's SOFTHSM2_CONF line is prose for
          # humans — path plus "(token label …)" — so cut at the first space
          # and export the bare path, which is all libsofthsm2 wants.
          conf=$(sed -n "s/^SOFTHSM2_CONF=\([^ ]*\).*/\1/p" /tmp/keystore-setup.log)
          [ -n "$conf" ] && echo "SOFTHSM2_CONF=$conf" >> "$GITHUB_ENV"
          echo "OPENFIRMA_TEST_PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo 'OPENFIRMA_TEST_NSS_DB=sql:/tmp/opencode/keystores/nssdb' >> "$GITHUB_ENV"

      - name: build
        run: cargo build --all-targets --target ${{ matrix.target }}

      - name: test
        # The default is a CI-only fallback so SoftHSM never silently reads
        # /etc/softhsm2.conf and its world-writable token directory; on Linux
        # GITHUB_ENV overrides it with the path the setup step created.
        env:
          SOFTHSM2_CONF: /tmp/opencode/keystores/softhsm/softhsm2.conf
        run: cargo test --target ${{ matrix.target }}

      # H-22: the version-guard test is `#[ignore]`d because it sets a
      # process-global variable, and its production hook exists ONLY so this
      # branch can be exercised on CI against a real module. Running it here
      # (own invocation, serial threads) closes "the test never runs" for
      # good; Linux-only because it needs SoftHSM itself.
      - name: version guard refusal (ignored test, run alone)
        if: runner.os == 'Linux'
        run: cargo test -p openfirma-keystore --test pkcs11 -- --ignored --test-threads=1

  # i686-pc-windows-msvc is where the PKCS#11 ABI cfgs differ most (packed
  # cryptoki headers, 4-byte pointers) and where a natural-alignment or
  # usize-equals-unsigned-long assumption breaks first. It ships in the
  # release matrix, so its *tests* must run here: on a windows runner the
  # target is native, cargo test executes the i686 binaries for real, and
  # every compile-time layout assert in openfirma-keystore/src/pkcs11/types.rs
  # plus the runtime checks of tests/pkcs11_abi.rs evaluate on the 32-bit ABI.
  # The GUI stays excluded: no 32-bit windowing stack is provisioned (the
  # release job builds it CLI-only too).
  test-i686-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Same PKI recipe as the matrix's windows jobs (Git Bash can see the
      # openssl Git for Windows bundles), because openfirma-core's lib tests
      # exercise 32-bit integer/pointer behaviour and belong in this job.
      - name: generate test PKI
        shell: bash
        run: |
          openssl_bin="$(command -v openssl || true)"
          if [ -z "$openssl_bin" ]; then
            for candidate in "$(dirname "$(command -v git)")/../usr/bin" "/c/Program Files/Git/usr/bin"; do
              if [ -x "$candidate/openssl.exe" ]; then openssl_bin="$candidate/openssl.exe"; break; fi
            done
          fi
          if [ -z "$openssl_bin" ]; then
            echo "no openssl on this runner, tests needing the PKI will skip"
            echo "OPENFIRMA_ALLOW_NONKEYSTORE_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          dir="$(dirname "$openssl_bin")"
          export PATH="$dir:$PATH"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -w "$dir")"; fi
          echo "$dir" >> "$GITHUB_PATH"
          openssl version
          ./tools/gen-testcert.sh
      # No SoftHSM/NSS test modules exist for i686 Windows, so the keystore
      # integration tests must skip instead of panicking under
      # OPENFIRMA_REQUIRE_TESTS. The ABI tests and asserts need nothing.
      - name: allow keystore skips where no store exists (windows)
        run: echo "OPENFIRMA_ALLOW_SKIP=1" >> "$GITHUB_ENV"
        shell: bash
      - name: build every member without the GUI (no 32-bit windowing stack here)
        run: cargo build --workspace --exclude openfirma-gui --target i686-pc-windows-msvc
      # A PKI means this runner is complete: REQUIRE_TESTS stays in force for
      # the tests below, and an openssl that was not found keeps only the
      # NONKEYSTORE opt-out (set above). The old dance of flipping
      # OPENFIRMA_REQUIRE_TESTS back on here existed because one blanket
      # ALLOW_SKIP covered everything; with H-2's scoping the keystore skips
      # and the PKI-dependent tests no longer share an opt-out, so nothing
      # needs un-setting.
      - name: fixtures for the 32-bit ABI tests
        shell: bash
        run: |
          openssl_bin="$(command -v openssl || true)"
          if [ -z "$openssl_bin" ]; then
            for candidate in "$(dirname "$(command -v git)")/../usr/bin" "/c/Program Files/Git/usr/bin"; do
              if [ -x "$candidate/openssl.exe" ]; then openssl_bin="$candidate/openssl.exe"; break; fi
            done
          fi
          if [ -n "$openssl_bin" ]; then
            export PATH="$(dirname "$openssl_bin"):$PATH"
            # python3 is a hard need of gen-p12-fixtures.sh (the java-empty
            # re-MAC step); absent, skip the whole fixture set like the
            # matrix job does rather than die on "command not found".
            if command -v python3 >/dev/null 2>&1; then
              ./tools/gen-p12-fixtures.sh
            else
              echo "no python3 on this runner; PKCS#12 interop fixtures stay absent and their tests skip"
            fi
          else
            echo "no openssl on this runner; fixture tests will skip"
          fi
      # Serial: the lib tests swap process-wide HOME inside one locked
      # window, and one thread per binary keeps sibling binaries from
      # stepping on each other's environment.
      - name: keystore tests on the 32-bit ABI (ABI asserts execute natively)
        run: cargo test -p openfirma-keystore --target i686-pc-windows-msvc --lib -- --test-threads=1
      - name: keystore integration tests and openfirma-core on the 32-bit ABI
        run: cargo test -p openfirma-keystore -p openfirma-core --target i686-pc-windows-msvc

  no-real-certs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: tracked files
        run: ./tools/check-no-real-certs.sh --tracked
      - name: full history
        run: ./tools/check-no-real-certs.sh --history
