# cargo-about configuration — the licence report every release artifact ships.
#
# `cargo about generate tools/ABOUT_TEMPLATE.hbs` resolves the whole lockfile,
# verifies each crate's declared licence expression, harvests the licence texts
# from the crate sources, and renders them through the template. The accepted
# list below is what openfirma's own licence (GPL-2.0-or-later OR EUPL-1.1) can
# lawfully combine with; anything new that lands outside it makes the report
# FAIL to generate — which is the point: an unacceptable licence cannot enter a
# release quietly.

accepted = [
  "MIT",
  "Apache-2.0",
  "MIT OR Apache-2.0",
  "Apache-2.0 OR MIT",
  "Unicode-3.0",
  "Zlib",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "BSD-1-Clause",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "OFL-1.1",
  # the font crates' real expressions; cargo-about satisfies OR-chains by
  # picking one accepted term, AND-chains need every part listed:
  "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0",
  "(MIT OR Apache-2.0) AND Unicode-3.0",
  "Apache-2.0 AND MIT",
  "Apache-2.0 OR GPL-2.0-only",
  "Apache-2.0 WITH LLVM-exception",
]

ignore-dev-dependencies = true
private = { ignore = true }

[ubuntu-font-licence]
accepted = ["Ubuntu-font-1.0"]
