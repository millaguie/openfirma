# cargo-about configuration — the licence report every release artifact ships.
#
# `cargo about generate tools/ABOUT_TEMPLATE.hbs` resolves the whole lockfile,
# verifies each crate's declared licence expression, harvests the licence texts
# from the crate sources, and renders them through the template. The accepted
# list below is what openfirma's own licence (GPL-2.0-or-later OR EUPL-1.1) can
# lawfully combine with; anything new that lands outside it makes the report
# FAIL to generate — which is the point: an unacceptable licence cannot enter a
# release quietly.
#
# Every entry must be a single SPDX licence identifier, optionally with a `WITH
# <exception>` clause — cargo-about parses this list as `spdx::Licensee`, not as
# an expression. A crate declared `MIT OR Apache-2.0` needs just "MIT" and
# "Apache-2.0" listed: an OR-chain is satisfied by any one accepted term, while
# an AND-chain needs every term. Compound entries ("MIT OR Apache-2.0",
# "(MIT OR Apache-2.0) AND OFL-1.1") are a config error and make the whole file
# fail to deserialize — which is how this list was found broken: it had six of
# them and the release job could not produce a report at all.

accepted = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "BSD-1-Clause",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  # the font crates: epaint_default_fonts declares
  # `(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0`, whose AND-parts are
  # these two plus MIT/Apache-2.0 above — there is no license *exception* here,
  # so a `[crate-name]` table with `accepted` is not the way to spell it (that
  # table configures a crate by name, and no crate is called this).
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Apache-2.0 WITH LLVM-exception",
]

ignore-dev-dependencies = true
private = { ignore = true }
