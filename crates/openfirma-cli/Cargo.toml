[package]
name = "openfirma-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "openfirma command line client"

[[bin]]
name = "openfirma"
path = "src/main.rs"

[dependencies]
openfirma-core.workspace = true
# The one format dispatcher (`signing`): the terminal and the window sign a
# given format through the exact same call sequence, so they cannot drift
# (finding M-4). Headless: this crate links no UI at all.
openfirma-browser.workspace = true
openfirma-cades.workspace = true
openfirma-pades.workspace = true
openfirma-xades.workspace = true
openfirma-keystore.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
tracing.workspace = true
zeroize.workspace = true
